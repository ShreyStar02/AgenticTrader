name: manage

# Manual fund/settings management for the unattended deployment.
# Run from the Actions tab -> "manage" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        type: choice
        required: true
        options:
          - add-funds
          - withdraw-funds
          - set-risk
          - set-autonomous
          - research
          - watchlist-add
          - watchlist-remove
          - buy
          - sell
      amount:
        description: "Amount in INR (add/withdraw) or quantity (buy/sell)"
        type: string
        default: "1000"
      symbol:
        description: "NSE symbol (research/watchlist/buy/sell), e.g. TCS"
        type: string
        default: ""
      password:
        description: "System password (add/withdraw/buy/sell)"
        type: string
        default: ""
      value:
        description: "risk: conservative|moderate|aggressive  •  autonomous: true|false"
        type: string
        default: "moderate"

permissions:
  contents: write
  actions: write   # to trigger the 'trade' workflow afterwards (refreshes dashboard)

concurrency:
  group: agentictrader
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Restore trading state (DB)
        run: |
          mkdir -p backend/data
          git fetch origin state || true
          if git cat-file -e origin/state:agentictrader.db 2>/dev/null; then
            git show origin/state:agentictrader.db > backend/data/agentictrader.db
            echo "Restored DB from 'state' branch."
          else
            echo "No prior state found; starting fresh."
          fi

      - name: Apply operation
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OP: ${{ inputs.operation }}
          AMOUNT: ${{ inputs.amount }}
          SYMBOL: ${{ inputs.symbol }}
          PASSWORD: ${{ inputs.password }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$OP" in
            add-funds)
              python -m app.jobs.funds_op add --amount "$AMOUNT" --password "$PASSWORD" ;;
            withdraw-funds)
              python -m app.jobs.funds_op withdraw --amount "$AMOUNT" --password "$PASSWORD" ;;
            set-risk)
              python -m app.jobs.funds_op set-risk --value "$VALUE" ;;
            set-autonomous)
              python -m app.jobs.funds_op set-autonomous --value "$VALUE" ;;
            research)
              python -m app.jobs.funds_op research --symbol "$SYMBOL" ;;
            watchlist-add)
              python -m app.jobs.funds_op watchlist-add --symbol "$SYMBOL" ;;
            watchlist-remove)
              python -m app.jobs.funds_op watchlist-remove --symbol "$SYMBOL" ;;
            buy)
              python -m app.jobs.funds_op buy --symbol "$SYMBOL" --amount "$AMOUNT" --password "$PASSWORD" ;;
            sell)
              python -m app.jobs.funds_op sell --symbol "$SYMBOL" --amount "$AMOUNT" --password "$PASSWORD" ;;
            *)
              echo "Unknown operation: $OP"; exit 1 ;;
          esac

      - name: Persist trading state (DB)
        run: |
          git config user.name "agentictrader-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin state || true
          if git show-ref --verify --quiet refs/remotes/origin/state; then
            git worktree add /tmp/state origin/state
            git -C /tmp/state checkout -B state
          else
            git worktree add --detach /tmp/state
            git -C /tmp/state checkout --orphan state
            git -C /tmp/state rm -rf . >/dev/null 2>&1 || true
          fi
          cp backend/data/agentictrader.db /tmp/state/agentictrader.db
          git -C /tmp/state add agentictrader.db
          git -C /tmp/state commit -m "state: manage update [skip ci]" || echo "No state change."
          git -C /tmp/state push origin state

      - name: Refresh dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run trade.yml -f force=true
